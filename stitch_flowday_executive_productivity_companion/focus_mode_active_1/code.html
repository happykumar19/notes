<script>
    // Micro-interaction for Pause button
    const pauseBtn = document.getElementById('btn-pause');
    const timerDisplay = document.getElementById('focus-timer');
    let isPaused = false;

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.textContent = 'Resume';
        pauseBtn.classList.replace('bg-surface-container', 'bg-secondary-container');
        pauseBtn.classList.replace('text-on-surface', 'text-on-secondary-container');
        timerDisplay.classList.add('opacity-50');
      } else {
        pauseBtn.textContent = 'Pause';
        pauseBtn.classList.replace('bg-secondary-container', 'bg-surface-container');
        pauseBtn.classList.replace('text-on-secondary-container', 'text-on-surface');
        timerDisplay.classList.remove('opacity-50');
      }
    });
