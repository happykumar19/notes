ken Grotesk"],"label-caps":["Hanken Grotesk"],"body-main":["Hanken Grotesk"]},fontSize:{"display-lg-mobile":["32px",{lineHeight:"38px",letterSpacing:"-0.01em",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"display-lg":["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"title-task":["18px",{lineHeight:"24px",fontWeight:"500"}],"label-metadata":["13px",{lineHeight:"18px",letterSpacing:"0.02em",fontWeight:"600"}],"label-caps":["11px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"700"}],"body-main":["16px",{lineHeight:"26px",fontWeight:"400"}]}}}}</script></head><body class="bg-background font-body-main flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-safe-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-11 h-11 flex items-center justify-center -ml-2 text-on-surface" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><img alt="Flowday logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLva5g_3DuvpVVRAZO9OmO6IDLNwtsNWsYhHPYrMAqE7MrFa2USQJEv_zpgGV4nnd2tRyUfN_HJ_Mu-DKh_L08l_KQxD4YbIhVWNzkaxVMnlWZBAX1gTd_eGwZ4LIoDRmbpb4Ja5O8hlQDSp3BGuwW4X4N1XMIa5IbmoJZsx2SQYxSdcX1I4IK3KGQLgkSuTdkapSYC_Fy_G7Rjb3NtElt0nnvhgw6ft-iRoudfPn5mKteDZ0Wh7S3Ipp00"/><h1 class="font-headline-md text-headline-md text-on-surface ml-2">Notification Setup</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 w-full pt-16 px-safe-margin bg-background relative pb-safe"><div class="flex flex-col w-full pb-32 pt-8">
<div class="flex flex-col gap-space-sm mb-space-xl">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">
      What do you want Flowday to help with?
    </h2>
<p class="font-body-main text-body-main text-on-surface-variant">
      Choose all that apply.
    </p>
</div>
<div class="flex flex-wrap gap-space-md" id="categories-container">
<button class="category-btn flex items-center justify-center px-space-lg py-4 bg-surface-container text-on-surface font-title-task text-title-task rounded-[32px] rounded-br-[8px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] transition-all duration-300 ease-out active:scale-95" data-val="work">
<span class="material-symbols-outlined mr-2 opacity-80">work</span>
      Work
    </button>
<button class="category-btn flex items-center justify-center px-space-lg py-4 bg-surface-container text-on-surface font-title-task text-title-task rounded-[32px] rounded-bl-[8px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] transition-all duration-300 ease-out active:scale-95" data-val="study">
<span class="material-symbols-outlined mr-2 opacity-80">menu_book</span>
      Study
    </button>
<button class="category-btn flex items-center justify-center px-space-lg py-4 bg-surface-container text-on-surface font-title-task text-title-task rounded-[32px] rounded-tl-[8px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] transition-all duration-300 ease-out active:scale-95" data-val="projects">
<span class="material-symbols-outlined mr-2 opacity-80">rocket_launch</span>
      Projects
    </button>
<button class="category-btn flex items-center justify-center px-space-lg py-4 bg-surface-container text-on-surface font-title-task text-title-task rounded-[32px] rounded-tr-[8px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] transition-all duration-300 ease-out active:scale-95" data-val="personal">
<span class="material-symbols-outlined mr-2 opacity-80">self_improvement</span>
      Personal life
    </button>
<button class="category-btn flex items-center justify-center px-space-lg py-4 bg-surface-container text-on-surface font-title-task text-title-task rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] transition-all duration-300 ease-out active:scale-95 mt-4 w-full" data-val="everything">
<span class="material-symbols-outlined mr-2 opacity-80">all_inclusive</span>
      Everything
    </button>
</div>
<div class="fixed bottom-safe-margin inset-x-safe-margin z-10 flex justify-end pointer-events-none">
<button class="pointer-events-auto flex items-center justify-center h-14 px-8 bg-primary text-on-primary rounded-full font-title-task text-title-task shadow-[0_8px_30px_rgba(26,26,26,0.08)] transition-all duration-300 opacity-50 translate-y-4" id="continue-btn">
      Continue
      <span class="material-symbols-outlined ml-2 text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const buttons = document.querySelectorAll('.category-btn');
    const continueBtn = document.getElementById('continue-btn');
    let selectedCategories = new Set();

    const updateButtonUI = (btn, isSelected) => {
      if (isSelected) {
        btn.classList.replace('bg-surface-container', 'bg-primary');
        btn.classList.replace('text-on-surface', 'text-on-primary');
        btn.classList.add('shadow-[0_8px_30px_rgba(26,26,26,0.08)]', '-translate-y-1');
        btn.classList.remove('shadow-[0_4px_20px_rgba(26,26,26,0.04)]');
      } else {
        btn.classList.replace('bg-primary', 'bg-surface-container');
        btn.classList.replace('text-on-primary', 'text-on-surface');
        btn.classList.remove('shadow-[0_8px_30px_rgba(26,26,26,0.08)]', '-translate-y-1');
        btn.classList.add('shadow-[0_4px_20px_rgba(26,26,26,0.04)]');
      }
    };

    const toggleContinueState = () => {
      if (selectedCategories.size > 0) {
        continueBtn.classList.remove('opacity-50', 'translate-y-4');
        continueBtn.classList.add('hover:scale-105', 'active:scale-95');
      } else {
        continueBtn.classList.add('opacity-50', 'translate-y-4');
        continueBtn.classList.remove('hover:scale-105', 'active:scale-95');
      }
    };

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;

        if (val === 'everything') {
          if (selectedCategories.has('everything')) {
            selectedCategories.clear();
          } else {
            selectedCategories.clear();
            selectedCategories.add('everything');
          }
        } else {
          selectedCategories.delete('everything');
          if (selectedCategories.has(val)) {
            selectedCategories.delete(val);
          } else {
            selectedCategories.add(val);
          }
        }

        buttons.forEach(b => {
          const isSelected = selectedCategories.has(b.dataset.val);
          updateButtonUI(b, isSelected);
        });

        toggleContinueState();
      });
    });
  });
</script></main></body></html>
