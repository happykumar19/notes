S-UcB5vYP1rSfE4m0UmUYJP3BS3XGb_-yOgSVne47J_gST3__M_gJInkDO7QOAfe0fl6yBmvN3AOnW1z8Xw6oVj6Zp0jmcb8V-zUN1nDYaaUQEtXckyUrldtFU7pOTA"/></div></header><main class="flex flex-col relative w-full pt-20 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full h-full relative px-safe-margin pb-6 pt-4">
<!-- Hero / Main Input Area -->
<div class="flex-1 flex flex-col justify-center items-center relative z-10 w-full mb-8">
<!-- Ambient subtle glow behind input -->
<div class="absolute inset-0 flex items-center justify-center -z-10 opacity-30 pointer-events-none">
<div class="w-64 h-64 bg-primary-fixed rounded-full blur-[80px]"></div>
</div>
<div class="w-full max-w-lg mx-auto">
<!-- Large transparent textarea -->
<textarea aria-label="Brain dump input" class="w-full bg-transparent border-none focus:ring-0 resize-none font-display-lg text-display-lg-mobile text-on-surface placeholder:text-outline-variant text-center overflow-hidden transition-all duration-300" id="braindump-input" placeholder="What's on your mind?" rows="2"></textarea>
<div class="h-1 w-24 bg-surface-container-highest mx-auto mt-6 rounded-full overflow-hidden relative transition-opacity duration-300 opacity-0" id="typing-indicator">
<div class="absolute inset-y-0 left-0 bg-primary-container w-1/3 rounded-full animate-[pulse_1.5s_ease-in-out_infinite]"></div>
</div>
</div>
</div>
<!-- Recently Captured Area -->
<div class="w-full max-w-lg mx-auto flex flex-col gap-4 mt-auto mb-8 z-20">
<div class="flex items-center justify-between px-2">
<span class="font-label-metadata text-label-metadata text-on-surface-variant uppercase tracking-wider">Recently Captured</span>
<span class="font-label-caps text-label-caps text-outline flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">history</span> 3
            </span>
</div>
<div class="flex flex-wrap gap-3" id="captured-list">
<!-- Captured Item 1 -->
<div class="px-5 py-3 bg-surface-container rounded-full flex items-center gap-2 shadow-[0_2px_8px_rgba(28,27,27,0.03)] transition-transform duration-200 active:scale-95 group hover:bg-surface-container-high cursor-pointer">
<span class="w-2 h-2 rounded-full bg-error-container"></span>
<span class="font-body-main text-on-surface whitespace-nowrap">Pay electric bill</span>
</div>
<!-- Captured Item 2 -->
<div class="px-5 py-3 bg-surface-container rounded-full flex items-center gap-2 shadow-[0_2px_8px_rgba(28,27,27,0.03)] transition-transform duration-200 active:scale-95 group hover:bg-surface-container-high cursor-pointer">
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
<span class="font-body-main text-on-surface whitespace-nowrap">Bug fix in login flow</span>
</div>
<!-- Captured Item 3 -->
<div class="px-5 py-3 bg-surface-container rounded-full flex items-center gap-2 shadow-[0_2px_8px_rgba(28,27,27,0.03)] transition-transform duration-200 active:scale-95 group hover:bg-surface-container-high cursor-pointer">
<span class="w-2 h-2 rounded-full bg-primary-fixed"></span>
<span class="font-body-main text-on-surface whitespace-nowrap">Buy milk</span>
</div>
</div>
</div>
<!-- Bottom Action Button -->
<div class="w-full max-w-lg mx-auto mt-4 z-20">
<button class="w-full py-4 bg-primary text-on-primary rounded-[24px] font-headline-md text-title-task shadow-[0_8px_24px_rgba(74,101,78,0.2)] flex items-center justify-center gap-3 transition-all duration-300 active:scale-[0.98] active:shadow-[0_4px_12px_rgba(74,101,78,0.1)] relative overflow-hidden group">
<span class="material-symbols-outlined text-[24px] group-hover:rotate-12 transition-transform duration-300">auto_awesome</span>
<span>Organize with AI</span>
<!-- Sparkle decorative effect -->
<div class="absolute top-1 right-4 w-1.5 h-1.5 bg-white/50 rounded-full animate-ping"></div>
<div class="absolute bottom-2 left-6 w-1 h-1 bg-white/40 rounded-full animate-pulse delay-150"></div>
</button>
</div>
<!-- Subtle animated particles for a "living" feel -->
<div class="absolute inset-0 pointer-events-none overflow-hidden -z-20" id="particle-container"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('braindump-input');
        const indicator = document.getElementById('typing-indicator');
        
        // Auto-resize textarea and show typing indicator
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            if (this.value.trim().length > 0) {
                indicator.classList.remove('opacity-0');
            } else {
                indicator.classList.add('opacity-0');
            }
            
            // Limit to max 4 lines roughly to prevent it taking over completely
            if(this.scrollHeight > 180) {
                this.style.overflow = 'auto';
            } else {
                this.style.overflow = 'hidden';
            }
        });
        
        // Focus on load for immediate entry
        setTimeout(() => input.focus(), 300);

        // Simple floating particles generator for delight
        const container = document.getElementById('particle-container');
        const colors = ['#cceace', '#f97d5e', '#ffd87c']; // primary-fixed, tertiary-container, secondary-container
        
        for(let i=0; i<6; i++) {
            const particle = document.createElement('div');
            const size = Math.random() * 6 + 4; // 4px to 10px
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                border-radius: 50%;
                background-color: ${color};
                opacity: ${Math.random() * 0.3 + 0.1};
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                filter: blur(1px);
                transition: transform 10s ease-in-out, opacity 5s;
            `;
            
            container.appendChild(particle);
            
            // Animate
            setInterval(() => {
                const moveX = (Math.random() - 0.5) * 40;
                const moveY = (Math.random() - 0.5) * 40;
                particle.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }, 3000 + Math.random() * 2000);
        }
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_10px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-20 px-gutter"><a class="flex flex-col items-center justify-center gap-1 w-14 h-14 text-on-surface-variant transition-all duration-200" data-path="today" href="#"><span class="material-symbols-outlined">calendar_today</span><span class="font-label-metadata text-label-metadata">Today</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-14 h-14 transition-all duration-200 text-primary font-bold" data-path="tasks" href="#"><span class="material-symbols-outlined">task_alt</span><span class="font-label-metadata text-label-metadata">Tasks</span></a><a class="flex flex-col items-center justify-center gap-1 w-14 h-14 text-on-surface-variant transition-all duration-200" data-path="focus" href="#"><span class="material-symbols-outlined">center_focus_strong</span><span class="font-label-metadata text-label-metadata">Focus</span></a><a class="flex flex-col items-center justify-center gap-1 w-14 h-14 text-on-surface-variant transition-all duration-200" data-path="insights" href="#"><span class="material-symbols-outlined">bar_chart</span><span class="font-label-metadata text-label-metadata">Insights</span></a><a class="flex flex-col items-center justify-center gap-1 w-14 h-14 bg-primary-container text-on-primary-container rounded-full shadow-lg transition-transform active:scale-95" data-path="companion" href="#"><span class="material-symbols-outlined">auto_awesome</span><span class="font-label-metadata text-label-metadata">AI</span></a></div></nav></body></html>
