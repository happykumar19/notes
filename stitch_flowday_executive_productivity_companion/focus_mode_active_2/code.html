<script>
        // Simple timer logic for demonstration
        let timeLeft = 24 * 60 + 36; // 24:36 in seconds
        const totalTime = 25 * 60;
        let isRunning = true;
        const timeDisplay = document.getElementById('timeDisplay');
        const timerRing = document.getElementById('timerRing');
        const circumference = 2 * Math.PI * 46; // 289.02

        function updateTimer() {
            if (!isRunning) return;
            
            if (timeLeft > 0) {
                timeLeft--;
                
                // Update text
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // Update ring (100 = start, 0 = full)
                const offset = circumference - (timeLeft / totalTime) * circumference;
                timerRing.style.strokeDashoffset = offset;
            }
        }

        function toggleTimer() {
            isRunning = !isRunning;
            const icon = event.currentTarget.querySelector('.material-symbols-outlined');
            const text = event.currentTarget.querySelector('.font-label-caps');
            if(isRunning) {
                icon.textContent = 'pause';
                text.textContent = 'Pause';
            } else {
                icon.textContent = 'play_arrow';
                text.textContent = 'Resume';
            }
        }

        // Update every second
        setInterval(updateTimer, 1000);
    </script>
