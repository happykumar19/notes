<script>
  document.addEventListener('DOMContentLoaded', () => {
    const buttons = document.querySelectorAll('.challenge-btn');
    const continueBtn = document.getElementById('continue-btn');
    let selectedCount = 0;

    // Define class sets for easy toggling
    const unselectedClasses = ['bg-surface-container-lowest', 'text-on-surface', 'shadow-[0_4px_20px_rgba(26,26,26,0.04)]'];
    const selectedClasses = ['bg-primary-container', 'text-on-primary-container', 'shadow-[0_8px_30px_rgba(26,26,26,0.08)]'];
    
    const iconContainerUnselected = ['bg-surface-container-low'];
    const iconContainerSelected = ['bg-surface-container-lowest'];
    
    const iconSymbolUnselected = ['text-on-surface-variant'];
    const iconSymbolSelected = ['text-on-primary-container'];

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const isSelected = btn.getAttribute('data-selected') === 'true';
        const iconContainer = btn.querySelector('.icon-container');
        const iconSymbol = btn.querySelector('.icon-symbol');
        const checkIcon = btn.querySelector('.check-icon');

        if (isSelected) {
          // Deselect
          btn.setAttribute('data-selected', 'false');
          btn.classList.remove(...selectedClasses);
          btn.classList.add(...unselectedClasses);
          
          iconContainer.classList.remove(...iconContainerSelected);
          iconContainer.classList.add(...iconContainerUnselected);
          
          iconSymbol.classList.remove(...iconSymbolSelected);
          iconSymbol.classList.add(...iconSymbolUnselected);
          
          checkIcon.classList.remove('opacity-100');
          checkIcon.classList.add('opacity-0');
          
          selectedCount--;
        } else {
          // Select
          btn.setAttribute('data-selected', 'true');
          btn.classList.remove(...unselectedClasses);
          btn.classList.add(...selectedClasses);
          
          iconContainer.classList.remove(...iconContainerUnselected);
          iconContainer.classList.add(...iconContainerSelected);
          
          iconSymbol.classList.remove(...iconSymbolUnselected);
          iconSymbol.classList.add(...iconSymbolSelected);
          
          checkIcon.classList.remove('opacity-0');
          checkIcon.classList.add('opacity-100');
          
          selectedCount++;
        }

        // Update Continue Button state
        if (selectedCount > 0) {
          continueBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'shadow-sm');
          continueBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_8px_30px_rgba(26,26,26,0.08)]');
        } else {
          continueBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_8px_30px_rgba(26,26,26,0.08)]');
          continueBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant', 'shadow-sm');
        }
      });
    });
  });
