<div class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute top-10 left-[-10%] w-[40vw] h-[40vw] rounded-full bg-primary-fixed/20 blur-3xl opacity-50"></div>
<div class="absolute bottom-20 right-[-10%] w-[50vw] h-[50vw] rounded-full bg-secondary-fixed/20 blur-3xl opacity-50"></div>
</div>
<div class="flex flex-col flex-1 justify-center max-w-md mx-auto w-full mt-space-lg">
<!-- Header -->
<div class="text-center mb-space-xl">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-space-sm tracking-tight text-balance">
        What's getting in the way?
      </h2>
<p class="font-body-main text-body-main text-outline opacity-80">
        It's okay. Let's figure it out together.
      </p>
</div>
<!-- Diagnostic Grid -->
<div class="grid grid-cols-2 gap-space-md" id="diagnostic-grid">
<!-- Card 1 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full">
<div class="w-14 h-14 rounded-full bg-primary-fixed-dim/30 flex items-center justify-center text-primary mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[32px] opacity-90" style="font-variation-settings: 'FILL' 0, 'wght' 300;">inventory_2</span>
</div>
<span class="font-title-task text-[15px] leading-[20px] font-medium text-on-surface text-balance">
          Too much to do
        </span>
</button>
<!-- Card 2 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full" style="transition-delay: 50ms;">
<div class="w-14 h-14 rounded-full bg-secondary-fixed-dim/30 flex items-center justify-center text-secondary mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[32px] opacity-90" style="font-variation-settings: 'FILL' 0, 'wght' 300;">explore</span>
</div>
<span class="font-title-task text-[15px] leading-[20px] font-medium text-on-surface text-balance">
          Don't know where to start
        </span>
</button>
<!-- Card 3 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full" style="transition-delay: 100ms;">
<div class="w-14 h-14 rounded-full bg-tertiary-fixed-dim/30 flex items-center justify-center text-tertiary mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[32px] opacity-90" style="font-variation-settings: 'FILL' 0, 'wght' 300;">auto_awesome</span>
</div>
<span class="font-title-task text-[15px] leading-[20px] font-medium text-on-surface text-balance">
          It feels boring
        </span>
</button>
<!-- Card 4 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full" style="transition-delay: 150ms;">
<div class="w-14 h-14 rounded-full bg-outline-variant/30 flex items-center justify-center text-on-surface-variant mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[32px] opacity-90" style="font-variation-settings: 'FILL' 0, 'wght' 300;">battery_1_bar</span>
</div>
<span class="font-title-task text-[15px] leading-[20px] font-medium text-on-surface text-balance">

        </span>
</button>
<!-- Card 5 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full" style="transition-delay: 200ms;">
<div class="w-14 h-14 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[32px] opacity-90" style="font-variation-settings: 'FILL' 0, 'wght' 300;">waves</span>
</div>
<span class="font-title-task text-[15px] leading-[20px] font-medium text-on-surface text-balance">
          I'm distracted
        </span>
</button>
<!-- Card 6 -->
<button class="diagnostic-card opacity-0 translate-y-4 flex flex-col items-center justify-center p-space-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(26,26,26,0.04)] active:shadow-none active:translate-y-[2px] transition-all duration-300 group text-center gap-space-sm h-full" style="transition-delay: 250ms;">
<div class="w-14 h-14 rounded-full bg-error-container/40 flex items-center justify-center text-on-error-container mb-space-xs group-hover:scale-110 group-active:scale-95 transition-transform duration-300 ease-out">

          I'm avoiding it
        </span>
</button>
</div>
<!-- Escape Hatch -->
<div class="mt-space-xl flex justify-center opacity-0 transition-opacity duration-700 delay-500" id="escape-hatch">
<button class="px-space-lg py-space-sm rounded-full bg-surface-container text-on-surface-variant font-label-metadata text-label-metadata hover:bg-surface-container-high transition-colors">
        Just tell me what to do
      </button>
</div>
</div>
</div>
<script>
  // Staggered fade-in animation for cards
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.diagnostic-card');
    const escapeHatch = document.getElementById('escape-hatch');
    
    // Trigger animations after a tiny delay to ensure DOM is ready
    setTimeout(() => {
      cards.forEach(card => {
        card.classList.remove('opacity-0', 'translate-y-4');
      });
      escapeHatch.classList.remove('opacity-0');
    }, 50);

    // Add satisfying click ripple/pulse effect
    cards.forEach(card => {
      card.addEventListener('click', function(e) {
        // Prevent multiple clicks while transitioning
        this.style.pointerEvents = 'none';
        
        // Gentle pulse on the icon wrapper
        const iconWrapper = this.querySelector('div');
        iconWrapper.classList.add('bg-primary', 'text-on-primary');
        iconWrapper.classList.remove('bg-primary-fixed-dim/30', 'bg-secondary-fixed-dim/30', 'bg-tertiary-fixed-dim/30', 'bg-outline-variant/30', 'bg-primary-fixed/50', 'bg-error-container/40', 'text-primary', 'text-secondary', 'text-tertiary', 'text-on-surface-variant', 'text-on-error-container');
        
        // Vibrate if supported
        if (navigator.vibrate) {
          navigator.vibrate(10);
        }

        // Simulate navigating away
        setTimeout(() => {
          this.style.pointerEvents = 'auto';
          // reset for demo purposes
          // window.location.href = '#'; 
        }, 600);
      });
    });
  });
</script></main></body></html>
