<div class="flex flex-col gap-space-md w-full mb-space-xl opacity-0 translate-y-6 transition-all duration-700 delay-150 ease-out" id="options-anim">

</button>
<button class="focus-option w-full group relative flex items-center p-space-lg rounded-[2rem] bg-surface-container-lowest text-on-surface shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:shadow-[0px_8px_30px_rgba(26,26,26,0.08)] transition-all duration-300 transform hover:-translate-y-1 active:scale-[0.98] overflow-hidden text-left" data-value="afternoon">
<div class="absolute inset-0 bg-gradient-to-r from-primary-fixed to-primary-fixed-dim opacity-0 transition-opacity duration-300 option-bg"></div>
<div class="relative z-10 flex items-center w-full">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-space-md group-hover:bg-surface-variant transition-colors icon-bg">
<span class="material-symbols-outlined text-on-surface-variant option-icon">light_mode</span>
</div>
<div class="flex-1">
<h3 class="text-title-task font-medium text-on-surface option-title">Afternoon</h3>
<p class="text-label-metadata text-on-surface-variant option-desc">Steady energy post-lunch</p>
</div>
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center opacity-0 scale-50 transition-all duration-300 check-icon">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</button>
<button class="focus-option w-full group relative flex items-center p-space-lg rounded-[2rem] bg-surface-container-lowest text-on-surface shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:shadow-[0px_8px_30px_rgba(26,26,26,0.08)] transition-all duration-300 transform hover:-translate-y-1 active:scale-[0.98] overflow-hidden text-left" data-value="evening">
<div class="absolute inset-0 bg-gradient-to-r from-primary-fixed to-primary-fixed-dim opacity-0 transition-opacity duration-300 option-bg"></div>
<div class="relative z-10 flex items-center w-full">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-space-md group-hover:bg-surface-variant transition-colors icon-bg">
<span class="material-symbols-outlined text-on-surface-variant option-icon">bedtime</span>
</div>
<div class="flex-1">
<h3 class="text-title-task font-medium text-on-surface option-title">Evening</h3>
<p class="text-label-metadata text-on-surface-variant option-desc">Night owl, quiet hours</p>
</div>
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center opacity-0 scale-50 transition-all duration-300 check-icon">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>

<div class="absolute inset-0 bg-gradient-to-r from-primary-fixed to-primary-fixed-dim opacity-0 transition-opacity duration-300 option-bg"></div>
<div class="relative z-10 flex items-center w-full">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-space-md group-hover:bg-surface-variant transition-colors icon-bg">
<span class="material-symbols-outlined text-on-surface-variant option-icon">shuffle</span>

<span>Next</span>
<span class="material-symbols-outlined ml-space-sm opacity-0 -translate-x-2 transition-all duration-300" id="btn-next-icon">arrow_forward</span>
</button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Entrance Animations
        setTimeout(() => {
            document.getElementById('header-anim').classList.remove('opacity-0', 'translate-y-4');
            document.getElementById('options-anim').classList.remove('opacity-0', 'translate-y-6');
            document.getElementById('footer-anim').classList.remove('opacity-0', 'translate-y-4');
        }, 100);

        const options = document.querySelectorAll('.focus-option');
        const nextBtn = document.getElementById('btn-next');
        const nextBtnIcon = document.getElementById('btn-next-icon');
        let selectedValue = null;

        options.forEach(option => {
            option.addEventListener('click', function() {
                // Deselect all
                options.forEach(opt => {
                    opt.setAttribute('aria-selected', 'false');
                    opt.classList.remove('shadow-[0px_8px_30px_rgba(26,26,26,0.08)]');
                    opt.querySelector('.option-bg').classList.remove('opacity-100');
                    opt.querySelector('.check-icon').classList.remove('opacity-100', 'scale-100');
                    opt.querySelector('.check-icon').classList.add('opacity-0', 'scale-50');
                    
                    // Reset text colors
                    opt.querySelector('.option-title').classList.remove('text-on-primary-fixed');
                    opt.querySelector('.option-desc').classList.remove('text-on-primary-fixed-variant');
                    opt.querySelector('.option-icon').classList.remove('text-on-primary-fixed');
                    opt.querySelector('.icon-bg').classList.remove('bg-primary-container/20');
                });

                // Select clicked
                this.setAttribute('aria-selected', 'true');
                this.classList.add('shadow-[0px_8px_30px_rgba(26,26,26,0.08)]');
                this.querySelector('.option-bg').classList.add('opacity-100');
                this.querySelector('.check-icon').classList.remove('opacity-0', 'scale-50');
                this.querySelector('.check-icon').classList.add('opacity-100', 'scale-100');
                
                // Update text colors for selected state to ensure contrast against primary-fixed gradient
                this.querySelector('.option-title').classList.add('text-on-primary-fixed');
                this.querySelector('.option-desc').classList.add('text-on-primary-fixed-variant');
                this.querySelector('.option-icon').classList.add('text-on-primary-fixed');
                this.querySelector('.icon-bg').classList.add('bg-primary-container/20');

                selectedValue = this.dataset.value;

                // Enable Next Button
                if (selectedValue) {
                    nextBtn.classList.remove('bg-surface-container', 'text-on-surface-variant', 'pointer-events-none');
                    nextBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary/90', 'shadow-md', 'transform', 'hover:-translate-y-1', 'active:scale-95');
                    nextBtn.removeAttribute('aria-disabled');
                    nextBtnIcon.classList.remove('opacity-0', '-translate-x-2');
                }
            });
        });

        // Next Button Click Animation
        nextBtn.addEventListener('click', (e) => {
            if(!selectedValue) return;
            
            // Create a simple ripple effect
            const ripple = document.createElement('div');
            ripple.classList.add('absolute', 'bg-white/20', 'rounded-full', 'pointer-events-none', 'animate-ping');
            const rect = nextBtn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size/2}px`;
            ripple.style.top = `${e.clientY - rect.top - size/2}px`;
            
            nextBtn.appendChild(ripple);
            nextBtn.classList.add('scale-95');
            
            setTimeout(() => {
                ripple.remove();
                nextBtn.classList.remove('scale-95');
                // Proceed to next screen logic would go here
            }, 300);
        });
    });
</script></main></body></html>
