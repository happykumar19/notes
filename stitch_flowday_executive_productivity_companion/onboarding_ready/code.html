<div class="flex-1 flex flex-col justify-between" id="onboarding-step-6">
<div class="flex flex-col space-y-space-xl">
<div class="flex flex-col space-y-space-sm items-center text-center mt-space-xl">
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface">Almost there.</h1>
<p class="text-body-main font-body-main text-on-surface-variant max-w-[280px]">One last thing. Do you want Flowday to adapt when your energy changes?</p>
</div>
<div class="bg-surface-container-low rounded-[24px] p-space-md shadow-[0px_4px_20px_rgba(26,26,26,0.04)] relative overflow-hidden transition-all duration-300 ease-out" id="adapt-card">
<div class="flex flex-col items-center justify-center space-y-space-md py-space-sm relative z-10">
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-space-sm">
<span class="material-symbols-outlined text-primary text-[32px] transition-transform duration-500" id="adapt-icon">autorenew</span>
</div>
<button class="w-full bg-primary text-on-primary font-title-task text-title-task py-space-md rounded-[16px] shadow-[0px_8px_30px_rgba(26,26,26,0.08)] flex items-center justify-center space-x-space-sm hover:scale-[0.98] transition-transform duration-200 focus:outline-none" id="adapt-btn">
<span>Yes, adapt for me</span>
</button>
<button class="text-on-surface-variant text-label-metadata font-label-metadata underline underline-offset-4 decoration-outline-variant hover:text-on-surface transition-colors mt-space-sm focus:outline-none" onclick="showCompletionState()">
            Skip for now
          </button>
</div>
</div>
</div>
</div>
<div class="absolute inset-0 bg-background z-50 flex flex-col items-center justify-center px-safe-margin opacity-0 pointer-events-none transition-opacity duration-700 ease-in-out" id="completion-state">
<div class="relative w-48 h-48 mb-space-xl transform translate-y-8 opacity-0 transition-all duration-1000 ease-out delay-300" id="companion-container">
<div class="absolute inset-0 bg-primary-fixed blur-3xl opacity-30 rounded-full animate-pulse"></div>
<img alt="AI Companion" class="w-full h-full object-cover rounded-full shadow-[0px_8px_30px_rgba(26,26,26,0.12)] relative z-10" src="https://lh3.googleusercontent.com/aida/AP1WRLvtZf-aVkVMkKER8tufcp7R4g8hkvlqYBecO7bLWXGFSV0nxNhAOpO3V8rQ3-ZOGMUZBTyqUUl6T_fvVetgnrA3VKJoYR9W9QVSzGr_gQxafnaSg8ZjABfvu7qAS-UcB5vYP1rSfE4m0UmUYJP3BS3XGb_-yOgSVne47J_gST3__M_gJInkDO7QOAfe0fl6yBmvN3AOnW1z8Xw6oVj6Zp0jmcb8V-zUN1nDYaaUQEtXckyUrldtFU7pOTA"/>
<div class="absolute -right-8 -top-4 bg-[#457B9D]/10 backdrop-blur-sm px-space-md py-space-sm rounded-[32px] rounded-bl-[8px] shadow-sm transform scale-0 origin-bottom-left transition-transform duration-500 delay-1000 ease-out z-20" id="welcome-bubble">
<span class="text-[#2B4C62] font-label-metadata text-label-metadata whitespace-nowrap">Welcome! 👋</span>
</div>
</div>
<div class="flex flex-col items-center text-center space-y-space-sm mb-space-xl transform translate-y-8 opacity-0 transition-all duration-700 ease-out delay-500" id="completion-text">
<h2 class="text-display-lg-mobile font-display-lg-mobile text-on-surface">You're ready.</h2>
<p class="text-body-main font-body-main text-on-surface-variant">Let's make today easier.</p>
</div>
<button class="w-full max-w-[300px] bg-primary text-on-primary font-title-task text-title-task py-space-md rounded-[24px] shadow-[0px_8px_30px_rgba(26,26,26,0.08)] transform translate-y-8 opacity-0 transition-all duration-700 ease-out delay-700 hover:scale-[0.98] active:shadow-none focus:outline-none" id="final-btn">
        Build my first day
      </button>
</div>
</div>
<script>
  const adaptBtn = document.getElementById('adapt-btn');
  const adaptIcon = document.getElementById('adapt-icon');
  
  adaptBtn.addEventListener('click', () => {
    adaptIcon.style.transform = 'rotate(180deg)';
    adaptBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
    adaptBtn.classList.add('opacity-80');
    
    setTimeout(() => {
       showCompletionState();
    }, 600);
  });

  function showCompletionState() {
    const completionState = document.getElementById('completion-state');
    const companion = document.getElementById('companion-container');
    const bubble = document.getElementById('welcome-bubble');
    const text = document.getElementById('completion-text');
    const finalBtn = document.getElementById('final-btn');

    completionState.classList.remove('opacity-0', 'pointer-events-none');
    completionState.classList.add('opacity-100');

    setTimeout(() => {
      companion.classList.remove('translate-y-8', 'opacity-0');
    }, 50);

    setTimeout(() => {
      text.classList.remove('translate-y-8', 'opacity-0');
    }, 200);

    setTimeout(() => {
      finalBtn.classList.remove('translate-y-8', 'opacity-0');
    }, 400);

    setTimeout(() => {
      bubble.classList.remove('scale-0');
      bubble.classList.add('scale-100');
    }, 800);
  }
</script></main></body></html>
